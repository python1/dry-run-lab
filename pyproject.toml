[project]
name = "dryrun-lab"
version = "0.1.0"
description = "Local dry-run lab for vendor-style network configs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Paul Charydczak" }]
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.scripts]
dryrun-lab = "dryrun_lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dryrun_lab = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
