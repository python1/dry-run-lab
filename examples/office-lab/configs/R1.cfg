version 17.9
hostname R1
!
no ip source-route
ip routing
!
ip access-list extended GUEST-IN
 deny ip 10.30.30.0 0.0.0.255 10.10.10.0 0.0.0.255
 deny ip 10.30.30.0 0.0.0.255 10.20.20.0 0.0.0.255
 permit ip any any
!
interface Loopback0
 description router id
 ip address 10.255.0.1 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description to SW1 Gi1/0/1
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description office vlan 10
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0.20
 description servers vlan 20
 encapsulation dot1Q 20
 ip address 10.20.20.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0.30
 description guest vlan 30
 encapsulation dot1Q 30
 ip address 10.30.30.1 255.255.255.0
 ip access-group GUEST-IN in
 no shutdown
!
interface GigabitEthernet0/0.99
 description management vlan 99
 encapsulation dot1Q 99
 ip address 10.99.0.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description upstream documentation range
 ip address 192.0.2.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description point to point toward the distribution switch
 ip address 10.50.0.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 10.255.0.1
 passive-interface default
 no passive-interface GigabitEthernet0/2
 network 10.10.10.0 0.0.0.255 area 0
 network 10.20.20.0 0.0.0.255 area 0
 network 10.30.30.0 0.0.0.255 area 0
 network 10.99.0.0 0.0.0.255 area 0
 network 10.50.0.0 0.0.0.3 area 0
 network 10.255.0.1 0.0.0.0 area 0
!
ip route 0.0.0.0 0.0.0.0 192.0.2.2
ip route 203.0.113.0 255.255.255.0 192.0.2.2
!
! Present in the file, and not modeled by the analyzer.
ip default-gateway 192.0.2.2
!
end
