version 17.9
hostname SW1
!
ip routing
!
vlan 10
 name OFFICE
vlan 20
 name SERVERS
vlan 30
 name GUEST
vlan 99
 name MGMT
!
interface Loopback0
 description switch router id
 ip address 10.255.1.1 255.255.255.255
 no shutdown
!
interface GigabitEthernet1/0/1
 description to R1 Gi0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
interface GigabitEthernet1/0/2
 description to SW2 Gi0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
interface GigabitEthernet1/0/3
 description trunk toward access switch 3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
interface GigabitEthernet1/0/10
 description spare access port
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface GigabitEthernet1/0/24
 description routed point to point
 no switchport
 ip address 10.50.0.2 255.255.255.252
 no shutdown
!
interface Vlan99
 description management
 ip address 10.99.0.2 255.255.255.0
 no shutdown
!
router ospf 1
 router-id 10.255.1.1
 passive-interface default
 no passive-interface GigabitEthernet1/0/24
 network 10.50.0.0 0.0.0.3 area 0
 network 10.255.1.1 0.0.0.0 area 0
!
ip default-gateway 10.99.0.1
!
end
